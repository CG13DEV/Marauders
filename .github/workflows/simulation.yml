name: Simulation Lab
on:
  push:
    paths:
      - 'simulation/**'
      - '.github/workflows/simulation.yml'
  pull_request:
    paths:
      - 'simulation/**'
      - '.github/workflows/simulation.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run demo
      - run: npm run perception-demo
      - run: npm run social-demo
      - run: npm run agency-demo
      - run: npm run living-demo
      - run: npm run school-day-demo
      - run: npm run learning-demo
      - run: npm run help-demo
