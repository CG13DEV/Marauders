name: Simulation Lab
on:
  push:
    paths:
      - 'simulation/**'
      - '.github/workflows/simulation.yml'
  pull_request:
    paths:
      - 'simulation/**'
      - '.github/workflows/simulation.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Experiment 31.2 endogenous first-action causality
        run: npm run spontaneous-demo
      - name: Experiment 31.3 lived-motivation counterfactual
        run: npm run lived-motivation-demo
      - name: Experiment 31.4 social-response choices
        run: npm run social-choice-demo
      - name: Experiment 31.5 relationship evidence choices
        run: npm run relationship-evidence-demo
      - name: R4 checkpoint cost diagnostic (48, 144, 634 residents)
        run: npm run checkpoint-profile
      - name: Experiment 31.6 multiday autonomous social life
        run: npm run open-social-life-demo
      - name: Experiment 31.7 school duty versus social promise
        run: npm run competing-obligations-demo
      - name: Experiment 31.8 deliberate amends and independent refusal
        run: npm run repair-initiative-demo
      - name: Experiment 31.9 cumulative first-person relationships
        run: npm run complex-relationships-demo
      - name: Experiments 31.10–31.12 contextual trust and player agency audit
        run: npm run social-integration-demo
      - run: npm run demo
      - run: npm run perception-demo
      - run: npm run social-demo
      - run: npm run agency-demo
      - run: npm run living-demo
      - run: npm run school-day-demo
      - run: npm run learning-demo
      - run: npm run help-demo
      - run: npm run play-demo
      - run: npm run week-demo
      - run: npm run planner-demo
      - run: npm run commitment-demo
      - run: npm run invitations-demo
      - run: npm run learning-purpose-demo
      - run: npm run intentions-demo
      - run: npm run unified-intentions-demo
      - run: npm run rollout-demo
      - run: npm run points-demo
      - run: npm run patrol-demo
      - run: npm run investigation-demo
      - run: npm run witness-demo
      - run: npm run evidence-goals-demo
      - run: npm run population-demo -- 144
      - run: npm run foundation-demo -- 144
      - run: npm run travel-demo -- 144
      - run: npm run weighted-passages-demo
      - run: npm run unified-demo -- 96
      - name: Experiment 30.3 route cache diagnostic
        run: npm run unified-demo -- 96
        env:
          MARAUDERS_ROUTE_PROFILE: '1'
      - name: Experiment 30.4 tick cost diagnostic
        run: npm run unified-demo -- 96
        env:
          MARAUDERS_TICK_PROFILE: '1'
          MARAUDERS_ROUTE_PROFILE: '1'
      - name: Experiment 30.5 scheduler phase diagnostic
        run: npm run unified-demo -- 96
        env:
          MARAUDERS_SCHEDULER_PROFILE: '1'
          MARAUDERS_TICK_PROFILE: '1'
          MARAUDERS_ROUTE_PROFILE: '1'
      - name: Experiment 30.8 seven-day 634-resident soak
        run: npm run week-soak-demo
      - name: Experiment 32.0 baseline 634-resident social load
        run: npm run social-school-stress -- --baseline
      - name: Experiment 32.0 full 624-agent social policy load
        run: npm run social-school-stress -- --all-eligible
      - name: Experiment 30.9 GC and ECS retention audit
        run: npm run memory-audit-demo
      - name: Experiment 31.1 counterfactual causal autonomy
        run: npm run causality-demo
