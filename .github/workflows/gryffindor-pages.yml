name: Gryffindor Tower Client and Pages
on:
  pull_request:
    paths:
      - 'client/**'
      - 'simulation/src/core/**'
      - 'simulation/src/scenarios/castle-layout.ts'
      - 'simulation/src/scenarios/school-week.ts'
      - 'simulation/src/scenarios/school-population.ts'
      - '.github/workflows/gryffindor-pages.yml'
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'simulation/src/core/**'
      - 'simulation/src/scenarios/castle-layout.ts'
      - 'simulation/src/scenarios/school-week.ts'
      - 'simulation/src/scenarios/school-population.ts'
      - '.github/workflows/gryffindor-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
concurrency:
  group: gryffindor-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Test living ECS, graph and build Three.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install simulation dependencies for build-time graph
        working-directory: simulation
        run: npm install
      - name: Install Three.js client
        working-directory: client
        run: npm install
      - name: Verify all Gryffindor nodes and authoritative topology
        working-directory: client
        run: npm test
      - name: Build for Github Pages
        working-directory: client
        run: npm run build
      - name: Validate Pages artifact entry
        run: test -s client/dist/index.html
      - name: Smoke test actual /Marauders/ URL and hashed JS asset
        working-directory: client
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          server=$!
          trap 'kill $server' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4173/Marauders/ -o /tmp/gryffindor.html; then break; fi
            sleep 1
          done
          grep -q 'Башня Гриффиндора' /tmp/gryffindor.html
          asset=$(grep -oE '/Marauders/assets/[^"]+\.js' /tmp/gryffindor.html | head -n 1)
          test -n "$asset"
          curl --silent --show-error --fail "http://127.0.0.1:4173$asset" -o /dev/null

      - name: Install Chromium for actual WebGL smoke
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: Test WebGL scene, keyboard, camera and graph-safe room transitions
        working-directory: client
        run: npm run browser-smoke
      - name: Upload visual verification screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rb-4-living-room-screenshots
          path: client/artifacts/*.png
          if-no-files-found: ignore
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
  deploy:
    if: github.event_name != 'pull_request'
    name: Publish Github Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
